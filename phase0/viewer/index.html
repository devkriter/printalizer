<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phase 0 viewer</title>
<style>
  :root { color-scheme: dark; --bg: #101317; --panel: #1a1e23; --line: #2d333a; --text: #e3e8ee; --dim: #8b96a3; --h: #4d8dff; --v: #b48cff; --a: #3ecf93; }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: grid; grid-template-columns: 300px 1fr; background: var(--bg); color: var(--text); font: 13px/1.4 Inter, 'Segoe UI', system-ui, sans-serif; }
  aside { border-right: 1px solid var(--line); overflow: auto; background: var(--panel); }
  aside h1 { font-size: 13px; margin: 0; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .row { display: grid; grid-template-columns: 1fr auto; gap: 6px; padding: 6px 14px; cursor: pointer; border-bottom: 1px solid #22272d; }
  .row:hover { background: #20262c; }
  .row.on { background: #22314f; }
  .row small { color: var(--dim); grid-column: 1 / -1; }
  .tag { font-size: 11px; padding: 0 6px; border-radius: 4px; border: 1px solid var(--line); color: var(--dim); }
  .tag.clean { color: #8db4ff; border-color: #34507f; }
  .tag.repaired { color: #c9d2db; }
  .tag.partial, .tag.refused { color: #e3e8ee; border-color: #8b96a3; }
  main { position: relative; min-height: 0; overflow: hidden; }
  canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
  #info { position: absolute; left: 12px; top: 12px; max-width: 460px; background: #1a1e23e6; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  #info b { font-weight: 600; }
  .key { display: inline-flex; align-items: center; gap: 6px; margin-right: 12px; color: var(--dim); }
  .sw { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
  #holes { max-height: 40vh; overflow: auto; margin-top: 6px; font-variant-numeric: tabular-nums; color: var(--dim); }
</style>
</head>
<body>
<aside><h1>Phase 0 corpus</h1><div id="list"></div></aside>
<main><canvas id="c"></canvas><div id="info">Pick a file.</div></main>
<script type="module" src="./main.ts"></script>
</body>
</html>
